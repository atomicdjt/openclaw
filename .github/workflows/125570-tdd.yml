name: 125570 Legacy TDD

on:
  push:
    branches:
      - fix/125570-legacy-tdd
  pull_request:

permissions:
  contents: read

jobs:
  focused-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply candidate provenance repair
        run: |
          git apply --check .github/125570-green.patch
          git apply .github/125570-green.patch
          git diff --check
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-deps: "true"
          frozen-lockfile: "true"
          dependency-cache: "false"
          use-actions-cache: "true"
      - name: Run description-boundary regression
        run: pnpm test src/skills/workshop/service-description-boundary.test.ts
