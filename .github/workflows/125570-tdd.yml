name: 125570 Legacy TDD

on:
  push:
    branches:
      - fix/125570-legacy-tdd
  pull_request:

permissions:
  contents: read

jobs:
  focused-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Apply candidate provenance repair
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/skills/workshop/types.ts",
              "  title: string;\n  description: string;\n  createdAt: string;",
              "  title: string;\n  description: string;\n  /** Canonical routing description intended for the live skill after an update. */\n  routingDescription?: string;\n  createdAt: string;",
          )
          replace_once(
              "src/skills/workshop/store-record.ts",
              "    title: z.string(),\n    description: z.string(),\n    createdAt: z.string(),",
              "    title: z.string(),\n    description: z.string(),\n    routingDescription: z.string().optional(),\n    createdAt: z.string(),",
          )
          Path("src/skills/workshop/routing-description-provenance.ts").write_text('''import type { SkillProposalRecord } from "./types.js";\n\nexport const LEGACY_UPDATE_REDRAFT_MESSAGE =\n  "This pending skill update predates routing-description provenance. Redraft the update before revising or applying it.";\n\n/**\n * Returns the canonical routing description for an update proposal.\n * Legacy pending updates intentionally fail closed because their stored\n * description cannot distinguish routing metadata from proposal summary text.\n */\nexport function requireUpdateRoutingDescription(\n  record: Pick<SkillProposalRecord, "kind" | "routingDescription">,\n): string | undefined {\n  if (record.kind !== "update") return undefined;\n  if (record.routingDescription === undefined) throw new Error(LEGACY_UPDATE_REDRAFT_MESSAGE);\n  return record.routingDescription;\n}\n''')
          replace_once(
              "src/skills/workshop/service.ts",
              '} from "./proposal-draft.js";\nimport { hashSkillProposalRevision } from "./revision-hash.js";',
              '} from "./proposal-draft.js";\nimport { requireUpdateRoutingDescription } from "./routing-description-provenance.js";\nimport { hashSkillProposalRevision } from "./revision-hash.js";',
          )
          replace_once(
              "src/skills/workshop/service.ts",
              '    title: `Update ${targetSkill.name}`,\n    description,\n    createdAt: now,',
              '    title: `Update ${targetSkill.name}`,\n    description,\n    routingDescription: skillDescription,\n    createdAt: now,',
          )
          replace_once(
              "src/skills/workshop/service.ts",
              '    const { record } = read;\n    assertInsideWorkspace(input.workspaceDir, record.target.skillFile, "skill file");',
              '    const { record } = read;\n    const existingRoutingDescription = requireUpdateRoutingDescription(record);\n    assertInsideWorkspace(input.workspaceDir, record.target.skillFile, "skill file");',
          )
          replace_once(
              "src/skills/workshop/service.ts",
              '''    const skillDescription =\n      record.kind === "update"\n        ? (normalizeOptionalString(parseSkillFrontmatter(requestedContent).description) ??\n          normalizeOptionalString(parseSkillFrontmatter(read.content).description))\n        : undefined;''',
              '''    const skillDescription =\n      record.kind === "update"\n        ? (input.content === undefined\n            ? existingRoutingDescription\n            : (normalizeOptionalString(parseSkillFrontmatter(input.content).description) ??\n              existingRoutingDescription))\n        : undefined;''',
          )
          replace_once(
              "src/skills/workshop/service.ts",
              '      ...record,\n      description,\n      updatedAt: now,',
              '      ...record,\n      description,\n      ...(record.kind === "update" ? { routingDescription: skillDescription! } : {}),\n      updatedAt: now,',
          )
          replace_once(
              "src/skills/workshop/apply-transition.ts",
              'import { hashSkillProposalRevision } from "./revision-hash.js";\nimport type { NewSkillProposalEvent } from "./store-sqlite-event.js";',
              'import { hashSkillProposalRevision } from "./revision-hash.js";\nimport { requireUpdateRoutingDescription } from "./routing-description-provenance.js";\nimport type { NewSkillProposalEvent } from "./store-sqlite-event.js";',
          )
          replace_once(
              "src/skills/workshop/apply-transition.ts",
              '  }\n  dependencies.assertExpectedRevisionHash(initial.revisionHash, input.expectedRevisionHash);',
              '  }\n  requireUpdateRoutingDescription(initial.record);\n  dependencies.assertExpectedRevisionHash(initial.revisionHash, input.expectedRevisionHash);',
          )
          replace_once(
              "src/skills/workshop/apply-transition.ts",
              '      }\n      dependencies.assertExpectedRevisionHash(read.revisionHash, evaluated.evaluation.revisionHash);',
              '      }\n      requireUpdateRoutingDescription(record);\n      dependencies.assertExpectedRevisionHash(read.revisionHash, evaluated.evaluation.revisionHash);',
          )
          replace_once(
              "src/skills/workshop/service-description-boundary.test.ts",
              '    expect(proposal.record.description).toBe(proposalSummary);\n    expect(proposal.content)',
              '    expect(proposal.record.description).toBe(proposalSummary);\n    expect(proposal.record.routingDescription).toBe(liveDescription);\n    expect(proposal.content)',
          )
          replace_once(
              "src/skills/workshop/service-description-boundary.test.ts",
              '    expect(revised.record.description).toBe(revisedSummary);\n    expect(revised.content)',
              '    expect(revised.record.description).toBe(revisedSummary);\n    expect(revised.record.routingDescription).toBe(liveDescription);\n    expect(revised.content)',
          )
          replace_once(
              "src/skills/workshop/service-description-boundary.test.ts",
              '    expect(replacement.record.description).toBe(replacementSummary);\n    expect(replacement.content)',
              '    expect(replacement.record.description).toBe(replacementSummary);\n    expect(replacement.record.routingDescription).toBe(replacementDescription);\n    expect(replacement.content)',
          )
      - name: Check candidate diff
        run: git diff --check
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-deps: "true"
          frozen-lockfile: "true"
          dependency-cache: "false"
          use-actions-cache: "true"
      - name: Run reviewer acceptance tests
        run: >-
          pnpm test
          src/skills/workshop/service-description-boundary.test.ts
          src/skills/workshop/service.test.ts
          src/agents/tools/skill-workshop-tool.test.ts
      - name: Run after-fix workspace behavior proof
        run: |
          node --import tsx --input-type=module <<'PROOF'
          import fs from "node:fs/promises";
          import os from "node:os";
          import path from "node:path";
          import { createOpenClawTestState } from "./src/test-utils/openclaw-test-state.ts";
          import { parseSkillFrontmatter } from "./src/skills/loading/frontmatter.ts";
          import { writeSkill } from "./src/skills/test-support/e2e-test-helpers.ts";
          import {
            applySkillProposal,
            proposeUpdateSkill,
            reviseSkillProposal,
          } from "./src/skills/workshop/service.ts";
          import { hashSkillProposalContent, replaceSkillProposalDraft } from "./src/skills/workshop/store.ts";

          const state = await createOpenClawTestState({
            layout: "state-only",
            prefix: "openclaw-125570-proof-state-",
          });
          const workspaceDir = await fs.mkdtemp(path.join(os.tmpdir(), "openclaw-125570-proof-workspace-"));
          const liveDescription =
            "Route cron-guard for cron safety, dry-run planning, alerts, digest review, rollback, and recovery workflows.";
          const proposalSummary = "Correct dead-man secret storage path.";
          try {
            const skillDir = path.join(workspaceDir, "skills", "cron-guard");
            await writeSkill({
              dir: skillDir,
              name: "cron-guard",
              description: liveDescription,
              body: "# Cron Guard\n\nExisting behavior.\n",
            });
            const proposal = await proposeUpdateSkill({
              workspaceDir,
              skillName: "cron-guard",
              description: proposalSummary,
              content: "# Cron Guard\n\nUpdated behavior.\n",
            });
            console.log(`PROPOSAL_SUMMARY=${proposal.record.description}`);
            console.log(`PROPOSAL_ROUTING=${proposal.record.routingDescription}`);
            if (proposal.record.description !== proposalSummary) throw new Error("proposal summary mismatch");
            if (proposal.record.routingDescription !== liveDescription) throw new Error("routing provenance mismatch");

            const revised = await reviseSkillProposal({
              workspaceDir,
              proposalId: proposal.record.id,
              expectedRevisionHash: proposal.revisionHash,
              description: "Document the storage correction.",
            });
            if (revised.record.routingDescription !== liveDescription) throw new Error("revision changed routing provenance");
            await applySkillProposal({
              workspaceDir,
              proposalId: revised.record.id,
              expectedRevisionHash: revised.revisionHash,
            });
            const liveFile = await fs.readFile(path.join(skillDir, "SKILL.md"), "utf8");
            const appliedDescription = parseSkillFrontmatter(liveFile).description;
            console.log(`APPLIED_ROUTING=${appliedDescription}`);
            if (appliedDescription !== liveDescription) throw new Error("applied routing description changed");

            const legacyDir = path.join(workspaceDir, "skills", "legacy-guard");
            const legacyDescription = "Route legacy-guard for durable scheduling and recovery workflows.";
            const legacySummary = "Adjust one legacy behavior.";
            await writeSkill({
              dir: legacyDir,
              name: "legacy-guard",
              description: legacyDescription,
              body: "# Legacy Guard\n\nExisting behavior.\n",
            });
            const safeLegacy = await proposeUpdateSkill({
              workspaceDir,
              skillName: "legacy-guard",
              description: legacySummary,
              content: "# Legacy Guard\n\nUpdated behavior.\n",
            });
            const legacyContent = safeLegacy.content.replace(
              `description: ${JSON.stringify(legacyDescription)}`,
              `description: ${JSON.stringify(legacySummary)}`,
            );
            if (legacyContent === safeLegacy.content) throw new Error("failed to construct legacy fixture");
            const legacyRecord = {
              ...safeLegacy.record,
              draftHash: hashSkillProposalContent(legacyContent),
            };
            delete legacyRecord.routingDescription;
            await replaceSkillProposalDraft({ record: legacyRecord, content: legacyContent });
            let blockedMessage = "";
            try {
              await applySkillProposal({ workspaceDir, proposalId: safeLegacy.record.id });
              throw new Error("legacy pending update unexpectedly applied");
            } catch (error) {
              blockedMessage = error instanceof Error ? error.message : String(error);
              if (!/redraft/i.test(blockedMessage)) throw error;
            }
            const unchangedLegacy = await fs.readFile(path.join(legacyDir, "SKILL.md"), "utf8");
            if (parseSkillFrontmatter(unchangedLegacy).description !== legacyDescription) {
              throw new Error("legacy apply changed live routing description");
            }
            console.log(`LEGACY_APPLY=BLOCKED_REDRAFT:${blockedMessage}`);
            console.log("PROOF_PASS=summary-separated-routing-preserved-legacy-fails-closed");
          } finally {
            await fs.rm(workspaceDir, { recursive: true, force: true });
            await state.cleanup();
          }
          PROOF
