name: Validate 125740 routing bound

on:
  pull_request:
    branches:
      - validation/125740-ci-base

permissions:
  contents: write

jobs:
  focused-validation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-deps: 'true'
          frozen-lockfile: 'true'
          dependency-cache: 'false'
          use-actions-cache: 'true'
      - name: Apply repository formatter
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec oxfmt \
            src/commands/doctor-skill-workshop-routing-provenance.test.ts \
            src/commands/doctor-skill-workshop-sqlite.ts \
            src/skills/workshop/service-description-boundary.test.ts \
            src/skills/workshop/service-query.ts \
            src/skills/workshop/frontmatter.ts \
            src/gateway/server-methods/skills-workspace-handler.ts \
            src/gateway/server-methods/skills-workspace-handler.test.ts \
            packages/gateway-protocol/src/schema/agents-models-skills-routing-description.test.ts
          git diff --check
      - name: Focused routing provenance tests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs \
            src/skills/workshop/service-description-boundary.test.ts \
            src/commands/doctor-skill-workshop-routing-provenance.test.ts \
            src/gateway/server-methods/skills-workspace-handler.test.ts \
            packages/gateway-protocol/src/schema/agents-models-skills-routing-description.test.ts
      - name: Changed-file static checks
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-changed.mjs -- \
            src/skills/workshop/routing-description-provenance.ts \
            packages/gateway-protocol/src/schema/agents-models-skills.ts \
            src/skills/workshop/service-query.ts \
            src/skills/workshop/frontmatter.ts \
            src/gateway/server-methods/skills-workspace-handler.ts \
            src/gateway/server-methods/skills-workspace-handler.test.ts
      - name: Protocol generation check
        run: pnpm protocol:check
      - name: Confirm formatter stability
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec oxfmt --check \
            src/commands/doctor-skill-workshop-routing-provenance.test.ts \
            src/commands/doctor-skill-workshop-sqlite.ts \
            src/skills/workshop/service-description-boundary.test.ts \
            src/skills/workshop/service-query.ts \
            src/skills/workshop/frontmatter.ts \
            src/gateway/server-methods/skills-workspace-handler.ts \
            src/gateway/server-methods/skills-workspace-handler.test.ts \
            packages/gateway-protocol/src/schema/agents-models-skills-routing-description.test.ts
      - name: Persist mechanical formatting only after validation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatter delta to persist."
            exit 0
          fi
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/commands/doctor-skill-workshop-routing-provenance.test.ts \
            src/commands/doctor-skill-workshop-sqlite.ts \
            src/skills/workshop/service-description-boundary.test.ts \
            src/skills/workshop/service-query.ts \
            src/skills/workshop/frontmatter.ts \
            src/gateway/server-methods/skills-workspace-handler.ts \
            src/gateway/server-methods/skills-workspace-handler.test.ts \
            packages/gateway-protocol/src/schema/agents-models-skills-routing-description.test.ts
          git commit -m "style: format #125740 routing repair"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
