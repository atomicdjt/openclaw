name: Temporary Routing Bound

on:
  push:
    branches:
      - test/125740-routing-output-bound

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          dependency-cache: "false"
          install-deps: "true"
          frozen-lockfile: "true"
      - name: Run routing-description boundary regression
        run: node scripts/run-vitest.mjs src/skills/workshop/service-description-boundary.test.ts
